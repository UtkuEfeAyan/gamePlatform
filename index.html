<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platformer Improvement Kit</title>
    <script src="./lib/phaser.js"></script>
    <script src="./src/Scenes/Load.js"></script>
    <script src="./src/Scenes/Platformer.js"></script>
    <script src="./src/main.js"></script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      #phaser-game {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        position: relative;
      }
      #phaser-game canvas {
        display: block;
      }
      #description {
        display: none;
      }
    </style>
</head>
<body>
    <div id="phaser-game"></div>
    <span id="description"></span>
</body>
</html>
